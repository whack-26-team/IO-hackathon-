<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try REMY</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1a1a1a; --cream: #fff4e0; --tomato: #e8442e; --butter: #ffd166; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--cream); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    main { max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    h1 { font-size: clamp(48px, 9vw, 96px); margin: 0; letter-spacing: -2px; line-height: 1; }
    p { font-size: clamp(18px, 3vw, 26px); margin: 0; font-weight: 700; }
    .face { width: 120px; height: 120px; }
    .qr { background: #fff; border: 4px solid var(--ink); border-radius: 24px; box-shadow: 8px 8px 0 var(--ink); padding: 18px; }
    .qr img { width: min(60vw, 360px); height: auto; display: block; }
    .steps { font-size: clamp(15px, 2.4vw, 20px); font-weight: 700; line-height: 1.5; }
    .link { font-family: ui-monospace, monospace; font-size: 15px; word-break: break-all; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <img class="face" src="/icon.png" alt="">
    <h1>Try REMY</h1>
    <p>Scan with your phone camera. Remy's your live AI chef.</p>
    <div class="qr"><img id="qr" alt="QR code to open REMY"></div>
    <div class="steps">1. Allow camera &amp; microphone · 2. Tap <b>Start cooking</b> · 3. Say <b>"Remy, I'm making toast"</b></div>
    <div class="link" id="link"></div>
  </main>
  <script>
    // Judges get Honest, real Remy (not Pretend) on the low-cost backup voice
    const url = `${location.origin}/?judge=1&backup=1`;
    document.getElementById("qr").src = `/api/qr?text=${encodeURIComponent(url)}`;
    document.getElementById("link").textContent = url;
  </script>
</body>
</html>
